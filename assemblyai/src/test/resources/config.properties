# AssemblyAI Integration Test Configuration
# 
# IMPORTANT: This file contains real credentials for integration testing.
# DO NOT commit actual credentials to version control.
# Use environment variables or secure credential storage in CI/CD.

# AssemblyAI API Configuration
assemblyai.api.key=<paste-your-api-key-here>
assemblyai.base.url=https://api.assemblyai.com/v2

# Test Configuration
# Using AssemblyAI example audio file (Canadian wildfires news clip from GitHub)
test.audio.file.path=src/test/resources/audio/20230607_me_canadian_wildfires.mp3
test.timeout.seconds=600
test.polling.interval.seconds=3
test.max.polling.attempts=200

# Feature Flags for Integration Tests
test.enable.real.api.calls=true
test.enable.upload.tests=true
test.enable.transcription.tests=true
test.enable.sentiment.tests=true
test.enable.topic.tests=true

# Test Data Configuration
test.audio.min.size.bytes=1024
test.audio.max.size.mb=100
test.supported.formats=mp3,wav,flac,m4a

# Logging Configuration for Tests
test.log.level=DEBUG
test.log.api.requests=true
test.log.api.responses=true

# Notes:
# 1. To run integration tests with real API:
#    - Set test.enable.real.api.calls=true
#    - Add your real AssemblyAI API key
#    - Ensure test audio file exists at specified path
#
# 2. To skip integration tests (unit tests only):
#    - Keep test.enable.real.api.calls=false
#
# 3. API Key Security:
#    - Never commit real API keys
#    - Use environment variable: ${ASSEMBLYAI_API_KEY}
#    - Or use CI/CD secret management
#
# 4. Test Audio File:
#    - Place a sample audio file in src/test/resources/
#    - Supported formats: MP3, WAV, FLAC, M4A
#    - Recommended size: 1-5 MB for faster tests

